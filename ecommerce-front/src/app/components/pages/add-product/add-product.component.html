<div class="container">
  <div class="add-product-container">
    <h2>Agregar producto</h2>

  <div *ngIf="successMessage" class="alert alert-success" role="alert">
    {{ successMessage }}
  </div>
  <div *ngIf="errorMessage" class="alert alert-danger" role="alert">
    {{ errorMessage }}
  </div>

  <form [formGroup]="productForm" (ngSubmit)="onSubmit()">
    <div class="mb-3">
      <label>Nombre</label>
      <input type="text" class="form-control" formControlName="name">
      <div class="text-danger" *ngIf="productForm.get('name')?.invalid && productForm.get('name')?.touched">El nombre es obligatorio.</div>
    </div>
    <div class="mb-3">
      <label>Descripción</label>
      <textarea class="form-control" formControlName="description"></textarea>
      <div class="text-danger" *ngIf="productForm.get('description')?.invalid && productForm.get('description')?.touched">La descripción es obligatoria.</div>
    </div>
    <div class="mb-3">
      <label>Precio</label>
      <input type="number" class="form-control" formControlName="price" min="0.01" step="0.01">
      <div class="text-danger" *ngIf="productForm.get('price')?.invalid && productForm.get('price')?.touched">Precio válido requerido.</div>
    </div>
    <div class="mb-3">
      <label>Imagen</label>
      <input type="file" class="form-control" (change)="onFileChange($event)" accept="image/*">
      <div class="text-danger" *ngIf="productForm.get('imageUrl')?.invalid && productForm.get('imageUrl')?.touched">La imagen es obligatoria.</div>
      <div *ngIf="imagenPreview" class="mt-2">
        <label>Previsualización:</label><br>
        <img [src]="imagenPreview" alt="Previsualización" style="max-width: 200px; max-height: 200px;">
      </div>
    </div>
    <div class="mb-3">
      <label>Categoría</label>
      <select class="form-control" formControlName="category">
        <option value="">Selecciona una categoría</option>
        <option *ngFor="let cat of categorias" [value]="cat">{{ cat }}</option>
      </select>
      <div class="text-danger" *ngIf="productForm.get('category')?.invalid && productForm.get('category')?.touched">La categoría es obligatoria.</div>
    </div>
    <div class="mb-3">
      <label>Stock</label>
      <input type="number" class="form-control" formControlName="stock" min="0">
      <div class="text-danger" *ngIf="productForm.get('stock')?.invalid && productForm.get('stock')?.touched">El stock debe ser 0 o mayor.</div>
    </div>
    <button class="btn btn-primary" type="submit" [disabled]="productForm.invalid">Agregar producto</button>
  </form>
  </div>
</div>
